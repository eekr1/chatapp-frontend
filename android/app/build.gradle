apply plugin: 'com.android.application'
import groovy.json.JsonSlurper

def releaseManifestFile = rootProject.file('../release/talkx-release.json')
if (!releaseManifestFile.exists()) {
    throw new GradleException("Missing canonical release manifest: ${releaseManifestFile}")
}
def talkxRelease = new JsonSlurper().parse(releaseManifestFile)
def signingValues = [
    path: System.getenv('TALKX_ANDROID_KEYSTORE_PATH'),
    storePassword: System.getenv('TALKX_ANDROID_KEYSTORE_PASSWORD'),
    keyAlias: System.getenv('TALKX_ANDROID_KEY_ALIAS'),
    keyPassword: System.getenv('TALKX_ANDROID_KEY_PASSWORD')
]
def releaseSigningReady = signingValues.values().every { value -> value != null && !value.trim().isEmpty() }

android {
    namespace = "com.talkx.app"
    compileSdk = rootProject.ext.compileSdkVersion
    ndkVersion "30.0.14904198"
    defaultConfig {
        applicationId talkxRelease.applicationId
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode talkxRelease.androidVersionCode as Integer
        versionName talkxRelease.versionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseSigningReady) {
            releaseCandidate {
                storeFile file(signingValues.path)
                storePassword signingValues.storePassword
                keyAlias signingValues.keyAlias
                keyPassword signingValues.keyPassword
            }
        }
    }
    buildTypes {
        release {
            if (releaseSigningReady) {
                signingConfig signingConfigs.releaseCandidate
            }
            minifyEnabled true
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation platform('com.google.firebase:firebase-bom:33.10.0')
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

tasks.register('verifyAndroidBundledAssets') {
    group = 'verification'
    description = 'Fails the build when Android bundled web assets are stale.'

    doLast {
        def result = providers.exec {
            workingDir rootProject.file('..')
            commandLine 'node', 'scripts/mobile-release.mjs', 'assets'
            ignoreExitValue = true
        }.result.get()
        if (result.exitValue != 0) {
            throw new GradleException("Android bundled asset tree is stale. Run npm run mobile:sync:android-clean")
        }
    }
}

tasks.register('verifyReleaseSigningEnvironment') {
    group = 'verification'
    description = 'Fails release packaging when protected signing inputs are absent.'
    doLast {
        if (!releaseSigningReady) {
            throw new GradleException(
                'Release signing inputs are missing. Use the protected Wave 18 package command; unsigned release output is forbidden.'
            )
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn(tasks.named('verifyAndroidBundledAssets'))
}

tasks.matching { task -> task.name == 'bundleRelease' || task.name == 'assembleRelease' }.configureEach {
    dependsOn(tasks.named('verifyReleaseSigningEnvironment'))
}

tasks.matching { task -> task.name == 'uploadCrashlyticsMappingFileRelease' }.configureEach {
    enabled = false
    description = 'Disabled for Wave 18 internal RC; external Firebase upload requires separate approval.'
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
        apply plugin: 'com.google.firebase.crashlytics'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services and crashlytics plugins were not applied")
}
